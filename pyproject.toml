[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "sinara-slow"
version = "0.1.0"
description = "Host-compiled Sinara slow control, independent of RTIO"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["PyYAML>=6,<7", "jsonschema>=4,<5"]
[project.optional-dependencies]
serial = ["pyserial>=3.5,<4"]
kasli = ["litex"]
gateware = ["litex", "migen", "packaging", "pyserial"]
[project.scripts]
sinara-slow = "sinara_slow.cli:main"
sinara-flash = "sinara_slow.flash_cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
sinara_slow = ["schemas/*.json"]
