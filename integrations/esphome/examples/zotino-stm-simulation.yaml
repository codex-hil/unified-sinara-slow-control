# Synthetic register addresses/capabilities; not a physical wiring profile.
# Uses existing GPIO ABI (sinara-gpio-v1), not integrated ABI4 or a new crossbar.
esphome:
  name: zotino-stm-simulation
  build_path: /srv/codex-hil-data/unified-sinara-slow-control/work/builds/zotino-stm-simulation
host:
logger:
  level: DEBUG
external_components:
  - source:
      type: local
      path: ../components
    components: [sinara_gpio_endpoint, sinara_zotino]
sinara_gpio_endpoint:
  id: endpoint0
  controller: stm_sys_board
  mode: simulation
  slot: 1
  output_address: 0
  input_address: 1
  oe_address: 2
  abi_address: 0
  output_capable: [0, 1, 3, 4, 5, 7]
  input_capable: [2, 6]
sinara_zotino:
  id: zotino0
  endpoint_id: endpoint0
  pinmux:
    clk: {slot: 1, line: 0}
    mosi: {slot: 1, line: 1}
    miso: {slot: 1, line: 2}
    sync_n: {slot: 1, line: 3}
    led_cs_n: {slot: 1, line: 4}
    ldac_n: {slot: 1, line: 5}
    busy: {slot: 1, line: 6}
    clr_n: {slot: 1, line: 7}
output:
  - platform: sinara_zotino
    id: dac0
    zotino_id: zotino0
    channel: 0
interval:
  - interval: 2s
    then:
      - lambda: |-
          if (id(zotino0).set_voltage(0, 1.25) && id(zotino0).set_leds(0xa5))
            ESP_LOGI("zotino_result", "SIMULATED_WRITE_OK");
